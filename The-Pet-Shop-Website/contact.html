<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta Description (Requirement #1) -->
    <meta name="description" content="Get in touch with The Pet Shop. Contact us for inquiries about our pet products, store hours, and North York location.">
    <title>The Pet Shop - Contact Us</title>
</head>
<body>

    <header>
        <h1>Contact The Pet Shop</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Reach Out to Us</h2>
            <p>Have a question about our supplies? Fill out the form below!</p>
            
            <form>
                <label for="client-name">Your Name:</label><br>
                <input type="text" id="client-name" name="client-name" required><br><br>

                <label for="client-email">Email Address:</label><br>
                <input type="email" id="client-email" name="client-email" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="30" required></textarea><br><br>

                <input type="submit" value="Send Message">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 The Pet Shop. All rights reserved.</p>
    </footer>

</body>
</html>
