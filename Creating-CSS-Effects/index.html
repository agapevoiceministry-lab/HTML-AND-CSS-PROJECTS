<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effects Assignment</title>
    <!-- Google Fonts link -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Your local CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Interactive CSS Effects</h1>
        <p>Hover over the elements below to see smooth transitions and transformations in action.</p>

        <!-- Image Element for Hover Effect using your local picture -->
        <div class="image-section">
            <h3>Image Hover Effect</h3>
            <img src="sample.jpg" alt="Sample assignment image">
        </div>

        <!-- Hover Card Effect -->
        <div class="effect-card">
            <h3>Hover Card</h3>
            <p>This card lifts up and grows a deeper drop shadow when you hover your mouse over it.</p>
        </div>

        <!-- Animated Button Effect -->
        <button class="effect-button">Hover Me!</button>
    </main>

</body>
</html>
