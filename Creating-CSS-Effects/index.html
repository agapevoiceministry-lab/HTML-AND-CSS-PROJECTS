<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effects Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Interactive CSS Effects</h1>
        <p>Hover over the elements below to see smooth transitions and transformations in action.</p>

        <!-- Hover Card Effect -->
        <div class="effect-card">
            <h3>Hover Card</h3>
            <p>This card lifts up and grows a deeper drop shadow when you hover your mouse over it.</p>
        </div>

        <!-- Animated Button Effect -->
        <button class="effect-button">Hover Me!</button>
    </main>

</body>
</html>
